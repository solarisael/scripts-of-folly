name: GLSL drift

# The WebGL2 leg runs naga GLSL generated from the WGSL. This check fails
# when a WGSL change lands without `bun run glsl:build`.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  glsl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache naga-cli
        id: naga-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.1-${{ runner.os }}
      - name: Install naga-cli 30.0.1
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.1 --locked
      - name: Check the generated GLSL
        run: bun run glsl:check
